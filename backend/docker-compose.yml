services:
  api:
    build:
      context: ./api
      dockerfile: dockerfile
    container_name: crime_radar_api
    env_file:
      - ../.env
    network_mode: host
    restart: unless-stopped

  collector:
    build:
      context: ./collector
    container_name: crime_radar_collector
    env_file:
      - ../.env
    network_mode: host
    restart: unless-stopped
